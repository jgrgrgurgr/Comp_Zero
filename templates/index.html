<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타협제로 - 안전 경로 탐색</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>타협제로</h1>
        <p>공공데이터를 활용하여 가장 안전한 보행 경로를 찾아드립니다.</p>
        <form id="route-form">
            <div class="input-group">
                <label for="start-address">출발지</label>
                <input type="text" id="start-address" name="start_address" placeholder="예: 서울특별시 강남구 테헤란로 212" required>
            </div>
            <div class="input-group">
                <label for="end-address">도착지</label>
                <input type="text" id="end-address" name="end_address" placeholder="예: 서울특별시 강남구 역삼동 825-2" required>
            </div>
            <button type="submit">안전 경로 분석</button>
        </form>
        <div id="loading-indicator" style="display: none;">
            <p>경로를 분석 중입니다. 잠시만 기다려주세요...</p>
        </div>
        <div id="result-container" style="display: none;">
            <h2>분석 결과</h2>
            <div id="result-text"></div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
